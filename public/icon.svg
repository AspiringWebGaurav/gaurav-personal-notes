<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient: Deep Obsidian & Void Indigo -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0d17" />
      <stop offset="50%" stop-color="#111425" />
      <stop offset="100%" stop-color="#191c33" />
    </linearGradient>

    <!-- Border Gradient: Subtle Silver to Violet -->
    <linearGradient id="border-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(255, 255, 255, 0.25)" />
      <stop offset="50%" stop-color="rgba(139, 92, 246, 0.4)" />
      <stop offset="100%" stop-color="rgba(99, 102, 241, 0.1)" />
    </linearGradient>

    <!-- Primary Glyph Gradient: Electric Indigo -> Violet -> Neon Pink -->
    <linearGradient id="g-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="45%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#d946ef" />
    </linearGradient>

    <!-- Dog-ear / Note Fold Gradient: Cyan to Indigo -->
    <linearGradient id="fold-grad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>

    <!-- Ambient Glow Filter -->
    <filter id="glow-blur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="24" result="blur" />
    </filter>
  </defs>

  <!-- Squircle Base Canvas (App Icon Shape) -->
  <rect x="20" y="20" width="472" height="472" rx="116" fill="url(#bg-grad)" stroke="url(#border-grad)" stroke-width="4" />

  <!-- Ambient Glow Behind Icon -->
  <circle cx="256" cy="256" r="140" fill="#8b5cf6" opacity="0.18" filter="url(#glow-blur)" />

  <!-- Background Note Sheet Outline (Subtle watermark) -->
  <rect x="110" y="96" width="292" height="320" rx="28" fill="rgba(255, 255, 255, 0.03)" stroke="rgba(255, 255, 255, 0.08)" stroke-width="2" />

  <!-- Top-Right Folded Page Corner (Origami Note Fold) -->
  <path d="M 334 96 L 402 164 L 358 164 C 344 164, 334 154, 334 140 Z" fill="url(#fold-grad)" opacity="0.95" />
  <path d="M 334 96 L 402 164" stroke="rgba(255, 255, 255, 0.4)" stroke-width="2" />

  <!-- Central Bold Modern 'G' Monogram (Knowledge / GPN) -->
  <!-- Top arc sweeping around into the lower bowl -->
  <path d="M 324 192
           C 298 162, 230 156, 192 194
           C 152 234, 152 292, 192 332
           C 230 370, 298 368, 328 334
           C 344 316, 350 298, 350 274
           L 246 274"
        fill="none"
        stroke="url(#g-grad)"
        stroke-width="38"
        stroke-linecap="round"
        stroke-linejoin="round" />

  <!-- Pen Nib / Stylus Spark at Core -->
  <circle cx="246" cy="274" r="12" fill="#ffffff" />
  <circle cx="246" cy="274" r="20" fill="#ffffff" opacity="0.25" />

  <!-- Note Lines Accent in bottom left -->
  <line x1="184" y1="384" x2="260" y2="384" stroke="rgba(255, 255, 255, 0.2)" stroke-width="6" stroke-linecap="round" />
</svg>