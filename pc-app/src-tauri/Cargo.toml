[package]
name = "gpn"
version = "0.0.13"
description = "Gaurav Personal Notes Windows Desktop Application"
authors = ["Gaurav Patil"]
homepage = "https://gauravpatil.site"
edition = "2021"

[lib]
name = "pc_app_lib"
crate-type = ["staticlib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.40.2", features = ["bundled"] }
uuid = { version = "1.15", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
parking_lot = "0.12"
keyring = { version = "4.2", default-features = false, features = ["windows-native-keyring-store", "v1"] }
tokio = { version = "1", features = ["rt-multi-thread", "net", "sync", "time", "io-util", "macros"] }
reqwest = { version = "0.12", features = ["json", "multipart"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-notification = "2"
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"
tokio-util = "0.7"
winreg = "0.52"
base64 = "0.22"

[dev-dependencies]

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

[lints.rust]
linker_messages = "allow"

